global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: services
    static_configs:
      - targets: [gateway:8000, profiles:8000, tracking:8000, reporting0:8000, reporting1:8000, replica0:8000, replica1:8000]
  - job_name: cluster
    static_configs:
      - targets: [collector:8000]
